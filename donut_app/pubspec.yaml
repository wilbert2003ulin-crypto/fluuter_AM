name: donut_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Agregamos la librería de Rive para que funcione la animación del oso
  rive: ^0.13.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Integramos tanto tus carpetas originales como el archivo de la animación
  assets:
    - assets/images/
    - assets/icons/
    - assets/login_bear.riv